<!doctype html>
<html lang="fil">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101b4d" />
    <meta name="description" content="TALA — masayang voice-guided learning app para sa Grade 1." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⭐%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css?v=20" />
    <link rel="stylesheet" href="css/playful.css?v=20" />
    <link rel="stylesheet" href="css/vibrant.css?v=20" />
    <title>TALA • Masayang Pagkatuto</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand-button" data-action="home" aria-label="Bumalik sa tahanan">
          <span class="brand-star">★</span>
          <span><strong>TALA</strong><small>Masayang Pagkatuto</small></span>
        </button>
        <div class="topbar-actions">
          <button class="icon-button sound-toggle" data-action="sound-toggle" aria-label="Patayin ang tunog ng laro" aria-pressed="true" title="Tunog ng laro">🔊</button>
          <div class="wallet" aria-label="Mga bituin"><span>★</span><b id="wallet-stars">0</b></div>
          <button class="icon-button" data-action="dashboard" aria-label="Buksan ang ulat ng guro">☰</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="footer-note">Kasama mo si Tala sa bawat munting tagumpay. ✦</footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="js/data.js?v=20"></script>
    <script src="js/quest.js?v=20"></script>
    <script src="js/storage.js?v=20"></script>
    <script src="js/speech.js?v=20"></script>
    <script src="js/sfx.js?v=20"></script>
    <script src="js/visuals.js?v=20"></script>
    <script src="js/app.js?v=20"></script>
  </body>
</html>
