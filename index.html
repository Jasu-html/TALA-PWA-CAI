<!doctype html>
<html lang="fil">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151f47" />
    <meta name="description" content="TALA — A Voice-Guided Learning App for Grade 1 Learners." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/tala.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/tala-192.png" />
    <link rel="stylesheet" href="css/styles.css?v=40" />
    <link rel="stylesheet" href="css/playful.css?v=40" />
    <link rel="stylesheet" href="css/vibrant.css?v=40" />
    <link rel="stylesheet" href="css/compact.css?v=40" />
    <link rel="stylesheet" href="css/public.css?v=40" />
    <link rel="stylesheet" href="css/night.css?v=40" />
    <title>TALA — A Voice-Guided Learning App for Grade 1 Learners</title>
  </head>
  <body>
    <div id="launch-splash" class="launch-splash" role="status" aria-live="polite">
      <div class="launch-orbit" aria-hidden="true"><i></i><i></i><i></i><span>✦</span></div>
      <strong class="launch-wordmark">TALA<span>✦</span></strong>
      <p class="launch-tagline">Bawat munting hakbang, bagong ningning.</p>
      <span class="launch-loading" aria-hidden="true"></span>
      <p id="launch-status">Inihahanda ang iyong paglalakbay…</p>
      <button id="launch-retry" class="secondary-button" hidden>Muling buksan</button>
    </div>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand-button" data-action="home" aria-label="Bumalik sa tahanan">
          <span class="brand-star">★</span>
          <span><strong>TALA</strong><small lang="en">A Voice-Guided Learning App for Grade 1 Learners</small></span>
        </button>
        <div class="topbar-actions">
          <button class="icon-button sound-toggle" data-action="sound-toggle" aria-label="Patayin ang tunog ng laro" aria-pressed="true" title="Tunog ng laro">🔊</button>
          <div class="wallet" aria-label="Mga bituin"><span>★</span><b id="wallet-stars">0</b></div>
          <button class="icon-button" data-action="dashboard" aria-label="Buksan ang ulat ng guro">☰</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="footer-note">Kasama mo si Tala sa bawat munting tagumpay. ✦</footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <noscript><p class="noscript-note">Kailangan ng JavaScript ang TALA. Paganahin ito at muling buksan ang pahina.</p><style>.launch-splash{display:none}</style></noscript>
    <script src="js/launch.js?v=40"></script>
    <script src="js/data.js?v=40"></script>
    <script src="js/quest.js?v=40"></script>
    <script src="js/storage.js?v=40"></script>
    <script src="js/speech.js?v=40"></script>
    <script src="js/sfx.js?v=40"></script>
    <script src="js/visuals.js?v=40"></script>
    <script src="js/native.js?v=40"></script>
    <script src="js/legal.js?v=40"></script>
    <script src="js/public.js?v=40"></script>
    <script src="js/app.js?v=40"></script>
  </body>
</html>
